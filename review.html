<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JH Paper Log의 장문 논문 리뷰입니다.">
  <meta name="theme-color" content="#f6f6f3">
  <title>Paper Review — JH / PAPER LOG</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=20260810-11">
  <link rel="stylesheet" href="assets/lib/katex-0.18.0/katex.min.css">
  <link rel="stylesheet" href="review.css?v=20260810-3">
  <script defer src="assets/lib/markdown-it-14.3.0.min.js"></script>
  <script defer src="assets/lib/dompurify-3.4.12.min.js"></script>
  <script defer src="assets/lib/katex-0.18.0/katex.min.js"></script>
  <script defer src="assets/lib/katex-0.18.0/auto-render.min.js"></script>
  <script defer src="review.js?v=20260810-9"></script>
</head>
<body class="review-page">
  <a class="skip-link" href="#review-content">리뷰 본문으로 바로가기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html#top" aria-label="논문 리뷰 아카이브 처음으로">
        <span class="brand-mark" lang="en">JH /</span>
        <span class="brand-name" lang="en">PAPER LOG</span>
      </a>

      <nav class="primary-nav" aria-label="주요 메뉴">
        <a href="./index.html#library" lang="en">Reviews</a>
        <a href="./index.html#tags" lang="en">Tags</a>
      </nav>

      <p class="header-index" lang="en">PAPER—REVIEW</p>
    </div>
  </header>

  <main class="review-main" id="review-main">
    <article class="container review-article" aria-labelledby="review-title" aria-busy="true">
      <a class="review-back" href="./index.html#library" lang="en">← Paper Reviews</a>

      <header class="review-heading" id="review-heading">
        <p class="review-code" lang="en">PAPER REVIEW</p>
        <h1 id="review-title">리뷰를 불러오는 중입니다.</h1>
        <p class="review-citation" id="review-citation" hidden></p>
        <p class="review-lead" id="review-lead" hidden></p>
        <div class="review-meta" id="review-meta" hidden>
          <span class="status" id="review-status"></span>
          <div class="tag-list" id="review-tags" aria-label="태그"></div>
          <time id="review-updated"></time>
        </div>
      </header>

      <nav class="review-toc" id="review-toc" aria-label="이 리뷰의 목차" hidden>
        <p lang="en">Contents</p>
        <ol id="review-toc-list"></ol>
      </nav>

      <div class="review-content" id="review-content" aria-live="polite">
        <p class="review-state">리뷰 본문을 준비하고 있습니다.</p>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <p class="footer-brand" lang="en">JH / PAPER LOG</p>
        <p lang="en">Long-form paper review.</p>
      </div>
      <p class="footer-note">개인 논문 리뷰 아카이브 · 논문의 저작권은 각 원저자에게 있습니다.</p>
      <p class="footer-year">© 2026 Jaehong Choi</p>
    </div>
  </footer>
</body>
</html>
